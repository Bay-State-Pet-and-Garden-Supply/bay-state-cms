name: ci

# Minimal, boring, required-on-main validation for the Bay State CMS.
# Gates: typecheck + Vitest suite + Bun DB suite. Lint is intentionally NOT
# included: the repository carries ~2,600 pre-existing lint errors in files
# outside the issue-17 remediation scope (documented in the review handoff);
# that debt is tracked separately and must not block unrelated work.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5 # pinned; matches packageManager in package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test-runner coverage gate
        run: bun run test:runner-coverage

      - name: Vitest suite
        run: bunx vitest run

      - name: Bun DB suite
        run: bun run test:db
